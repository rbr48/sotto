name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (leave empty for pubspec version)'
        required: false
        default: ''
      draft:
        description: 'Publish as draft release'
        type: boolean
        default: false
      prerelease:
        description: 'Publish as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.6'

jobs:
  build-android:
    name: Android Release (Signed APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Configure Keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Using configured repository release keystore secret"
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > /tmp/release.keystore
            echo "ANDROID_KEYSTORE_PATH=/tmp/release.keystore" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "No custom ANDROID_KEYSTORE_BASE64 secret; generating release keystore"
            keytool -genkeypair -v -keystore /tmp/release.keystore -alias sotto -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass sotto-release-secret -keypass sotto-release-secret \
              -dname "CN=Sotto, O=Izhaan Intellect, C=US"
            echo "ANDROID_KEYSTORE_PATH=/tmp/release.keystore" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=sotto-release-secret" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=sotto" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=sotto-release-secret" >> $GITHUB_ENV
          fi
      - name: Build Android Release APK
        working-directory: app
        run: flutter build apk --release
      - name: Package APK
        run: |
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-release.apk dist/sotto-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/sotto-android.apk

  build-linux:
    name: Linux Release (tar.gz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libpulse-dev libsecret-1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libayatana-appindicator3-dev libnotify-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build Linux Release
        working-directory: app
        run: flutter build linux --release
      - name: Package Linux tar.gz
        run: |
          mkdir -p dist
          tar -czf dist/sotto-linux-x64.tar.gz -C app/build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/sotto-linux-x64.tar.gz

  build-windows:
    name: Windows Release (ZIP)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build Windows Release
        working-directory: app
        run: flutter build windows --release
      - name: Package Windows ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath dist/sotto-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/sotto-windows-x64.zip

  publish:
    name: Publish GitHub Release
    needs: [build-android, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Determine Release Tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            VERSION=$(grep '^version:' app/pubspec.yaml | head -n1 | cut -d' ' -f2 | cut -d'+' -f1)
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Compute SHA-256 checksums
        working-directory: dist
        run: |
          sha256sum sotto-android.apk sotto-linux-x64.tar.gz sotto-windows-x64.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Sotto ${{ steps.tag.outputs.tag }}
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            dist/sotto-android.apk
            dist/sotto-linux-x64.tar.gz
            dist/sotto-windows-x64.zip
            dist/SHA256SUMS.txt

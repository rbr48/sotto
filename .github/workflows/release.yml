name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (leave empty for pubspec version)'
        required: false
        default: ''
      draft:
        description: 'Publish as draft release'
        type: boolean
        default: false
      prerelease:
        description: 'Publish as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

# One release run per tag at a time; a second push waits instead of racing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.6'

jobs:
  version:
    name: Release tag and app version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Determine the tag and check it matches app/pubspec.yaml
        id: tag
        # Android only installs an update with a higher version code, so the
        # version in pubspec.yaml must be raised for every release.
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          VERSION=$(grep '^version:' app/pubspec.yaml | head -n1 | cut -d' ' -f2)
          NAME=${VERSION%%+*}
          if [ "$REF_TYPE" = "tag" ]; then TAG="$REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then TAG="$INPUT_TAG"
          else TAG="v$NAME"; fi
          if [ "$TAG" != "v$NAME" ]; then
            echo "::error::Tag $TAG does not match the app version $VERSION in app/pubspec.yaml (expected v$NAME)"
            exit 1
          fi
          case "$VERSION" in *+*) ;; *)
            echo "::error::app/pubspec.yaml needs a build number (e.g. $NAME+2): it is Android's version code"
            exit 1 ;;
          esac
          # F-Droid and Google Play show this file as "What's new".
          CHANGELOG="fastlane/metadata/android/en-US/changelogs/${VERSION#*+}.txt"
          if [ ! -f "$CHANGELOG" ]; then
            echo "::error::$CHANGELOG is missing: write what changed for users (500 bytes at most)"
            exit 1
          fi
          if [ "$(wc -c < "$CHANGELOG")" -gt 500 ]; then
            echo "::error::$CHANGELOG is longer than 500 bytes (the store limit)"
            exit 1
          fi
          echo "Releasing $TAG (version $VERSION)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  gate:
    name: Released from main, after CI passed
    needs: version
    runs-on: ubuntu-latest
    # A release goes out only for a commit on main whose CI run passed, and
    # never replaces an existing release (moving a tag must not silently swap
    # the files people already downloaded and verified).
    permissions:
      actions: read
      contents: read
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: The commit is on main
        run: |
          STATUS=$(gh api "repos/$REPO/compare/$SHA...main" --jq .status)
          case "$STATUS" in
            identical | ahead) echo "$SHA is on main" ;;
            *)
              echo "::error::$SHA is not on main (compare status: $STATUS). Release only from main."
              exit 1 ;;
          esac
      - name: No release exists for this tag yet
        run: |
          # Lists drafts too (a draft is not found by its tag).
          FOUND=$(gh api --paginate "repos/$REPO/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\") | .html_url")
          if [ -n "$FOUND" ]; then
            echo "$FOUND"
            echo "::error::A release for $TAG already exists. Raise the version for a new release instead of moving the tag (or delete that release on purpose first)."
            exit 1
          fi
      - name: CI passed for this commit on main
        # The tag and main are usually pushed together: wait for CI's run.
        run: |
          for _ in $(seq 1 80); do
            RUNS=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&branch=main&event=push&per_page=20" \
              --jq '.workflow_runs[] | "\(.status) \(.conclusion) \(.html_url)"')
            if echo "$RUNS" | grep -q '^completed success '; then
              echo "CI passed: $(echo "$RUNS" | grep '^completed success ' | head -n 1 | cut -d' ' -f3)"
              exit 0
            fi
            if [ -n "$RUNS" ] && ! echo "$RUNS" | grep -qv '^completed '; then
              echo "$RUNS"
              echo "::error::CI did not pass for $SHA on main. Fix it (or re-run CI), then run the release again."
              exit 1
            fi
            echo "Waiting for CI on main for $SHA..."
            sleep 30
          done
          echo "::error::No finished CI run on main for $SHA after 40 minutes"
          exit 1

  build-android:
    name: Android Release (Signed APK)
    needs: [version, gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Configure the release keystore
        # Every release must be signed with the same key, or Android refuses
        # to install it as an update. There is no fallback: without the
        # secrets, the release stops here.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Add the release keystore secrets (docs/RELEASES.md) and run the release again."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build Android Release APK
        working-directory: app
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release
          # For Google Play: an app bundle, without Sotto's own update notice
          # (Play delivers the updates, and its rules forbid other update
          # paths). Signed with the same key, as the Play upload key.
          flutter build appbundle --release --dart-define=SOTTO_UPDATE_URL=
      - name: Check the signature
        # Prints the signing certificate's SHA-256 fingerprint (published in
        # the release notes); if the ANDROID_CERT_SHA256 variable is set, the
        # APK must match it, so a release can't go out with another key.
        env:
          EXPECTED: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          rm -f "$RUNNER_TEMP/release.keystore"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs app/build/app/outputs/flutter-apk/app-release.apk | tee signature.txt
          if grep -q "CN=Android Debug" signature.txt; then
            echo "::error::The APK is signed with the debug key"
            exit 1
          fi
          ACTUAL=$(grep -E -i "certificate SHA-256 digest:" signature.txt | head -n 1 | sed -E 's/.*certificate SHA-256 digest:[[:space:]]*//I' | tr -d ': ' | tr 'a-f' 'A-F')
          if [ -z "$ACTUAL" ]; then
            echo "::error::Could not read the signing certificate"
            exit 1
          fi
          if [ -n "$EXPECTED" ] && [ "$ACTUAL" != "$(echo "$EXPECTED" | tr -d ': ' | tr 'a-f' 'A-F')" ]; then
            echo "::error::The APK's certificate ($ACTUAL) is not the expected one ($EXPECTED)"
            exit 1
          fi
          mkdir -p dist
          echo "$ACTUAL" > dist/android-cert-sha256.txt
      - name: Package APK and app bundle
        run: |
          cp app/build/app/outputs/flutter-apk/app-release.apk dist/sotto-android.apk
          cp app/build/app/outputs/bundle/release/app-release.aab dist/sotto-android-play.aab
          # The bundle must carry the same certificate as the APK.
          keytool -printcert -jarfile dist/sotto-android-play.aab | tee bundle-cert.txt
          BUNDLE=$(grep -E "SHA256:" bundle-cert.txt | head -n 1 | sed -E 's/.*SHA256:[[:space:]]*//' | tr -d ': ' | tr 'a-f' 'A-F')
          if [ "$BUNDLE" != "$(cat dist/android-cert-sha256.txt)" ]; then
            echo "::error::The app bundle's certificate ($BUNDLE) is not the APK's"
            exit 1
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: release-android
          path: |
            dist/sotto-android.apk
            dist/sotto-android-play.aab
            dist/android-cert-sha256.txt

  build-linux:
    name: Linux Release (AppImage, .deb, tar.gz)
    needs: [version, gate]
    # The oldest supported Ubuntu: the app then runs on Ubuntu 22.04+ and
    # Debian 12+ (a build on 24.04 needs glibc 2.38).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          # The 22.04 image ships libunwind-14-dev, which conflicts with the
          # libunwind-dev that libgstreamer1.0-dev needs.
          sudo apt-get remove -y libunwind-14-dev || true
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libpulse-dev libsecret-1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libayatana-appindicator3-dev libnotify-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build Linux Release
        working-directory: app
        run: flutter build linux --release
      - name: Package Linux tar.gz
        run: |
          mkdir -p dist
          tar -czf dist/sotto-linux-x64.tar.gz -C app/build/linux/x64/release/bundle .
      - name: Package .deb and AppImage
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          packaging/linux/fetch-appimage-tools.sh "$RUNNER_TEMP/appimage"
          packaging/linux/build-deb.sh "${TAG#v}" app/build/linux/x64/release/bundle dist
          packaging/linux/build-appimage.sh app/build/linux/x64/release/bundle dist \
            "$RUNNER_TEMP/appimage/appimagetool" "$RUNNER_TEMP/appimage/runtime-x86_64"
      - uses: actions/upload-artifact@v6
        with:
          name: release-linux
          path: |
            dist/sotto-linux-x64.tar.gz
            dist/sotto-linux-amd64.deb
            dist/sotto-linux-x86_64.AppImage

  build-windows:
    name: Windows Release (installer, ZIP)
    needs: [version, gate]
    runs-on: windows-latest
    outputs:
      signed: ${{ steps.signing.outputs.enabled }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build Windows Release
        working-directory: app
        run: flutter build windows --release
      # Code signing through SignPath (free for open-source projects; see
      # docs/CODE_SIGNING.md). It runs once the SIGNPATH_ORGANIZATION_ID
      # variable and the SIGNPATH_API_TOKEN secret are set; until then the
      # builds stay unsigned, as before.
      - name: Code signing configured?
        id: signing
        shell: bash
        env:
          ORG: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if [ -n "$ORG" ] && [ -n "$TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SignPath is not set up: the Windows builds are not code-signed."
          fi
      - name: Upload the app for signing
        if: steps.signing.outputs.enabled == 'true'
        id: unsigned-app
        uses: actions/upload-artifact@v6
        with:
          name: unsigned-windows-app
          path: app/build/windows/x64/runner/Release/
      - name: Sign sotto.exe and its libraries
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'sotto' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY || 'release-signing' }}
          artifact-configuration-slug: windows-app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-app
      - name: Use the signed app
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: Copy-Item -Path signed-app/* -Destination app/build/windows/x64/runner/Release -Recurse -Force
      - name: Package Windows ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath dist/sotto-windows-x64.zip
      - name: Installer (Inno Setup)
        shell: pwsh
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: ./packaging/windows/build-installer.ps1 -Version $env:TAG.TrimStart('v')
      - name: Upload the installer for signing
        if: steps.signing.outputs.enabled == 'true'
        id: unsigned-installer
        uses: actions/upload-artifact@v6
        with:
          name: unsigned-windows-installer
          path: dist/sotto-windows-x64-setup.exe
      - name: Sign the installer
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'sotto' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY || 'release-signing' }}
          artifact-configuration-slug: windows-installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-installer
      - name: Use the signed installer
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: Copy-Item -Path signed-installer/sotto-windows-x64-setup.exe -Destination dist/ -Force
      - uses: actions/upload-artifact@v6
        with:
          name: release-windows
          path: |
            dist/sotto-windows-x64.zip
            dist/sotto-windows-x64-setup.exe

  build-ios:
    name: iOS Release (.ipa for sideloading)
    needs: [version, gate]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build iOS App (.app)
        working-directory: app
        run: |
          flutter build ios --release --no-codesign
      - name: Package .ipa for Sideloading
        run: |
          mkdir -p dist
          cd app/build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r -9 ../../../../dist/sotto-ios.ipa Payload
      - uses: actions/upload-artifact@v6
        with:
          name: release-ios
          path: dist/sotto-ios.ipa

  publish:
    name: Publish GitHub Release
    needs: [version, gate, build-android, build-linux, build-windows, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Compute SHA-256 checksums
        working-directory: dist
        run: |
          sha256sum sotto-android.apk sotto-android-play.aab sotto-windows-x64-setup.exe sotto-windows-x64.zip \
            sotto-linux-x86_64.AppImage sotto-linux-amd64.deb sotto-linux-x64.tar.gz sotto-ios.ipa > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release notes header
        env:
          WINDOWS_SIGNED: ${{ needs.build-windows.outputs.signed }}
        run: |
          {
            echo "### Verify your download"
            echo
            echo "- Android signing certificate (SHA-256): \`$(cat dist/android-cert-sha256.txt)\`"
            echo "- File checksums: \`SHA256SUMS.txt\`"
            echo "- iOS sideloading IPA: \`sotto-ios.ipa\` (install via AltStore, SideStore, Sideloadly or TrollStore)"
            if [ "$WINDOWS_SIGNED" = "true" ]; then
              echo "- The Windows installer and sotto.exe are code-signed. Linux builds are checked with SHA256SUMS.txt."
            else
              echo "- The Windows and Linux builds are not code-signed yet: Windows SmartScreen may warn about an unknown publisher."
            fi
            echo
          } > notes.md
      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Sotto ${{ needs.version.outputs.tag }}
          body_path: notes.md
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            dist/sotto-android.apk
            dist/sotto-android-play.aab
            dist/sotto-windows-x64-setup.exe
            dist/sotto-windows-x64.zip
            dist/sotto-linux-x86_64.AppImage
            dist/sotto-linux-amd64.deb
            dist/sotto-linux-x64.tar.gz
            dist/sotto-ios.ipa
            dist/SHA256SUMS.txt

name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'

jobs:
  server:
    name: Relay server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  installer:
    name: Self-host installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: shellcheck -x infra/install.sh infra/test/install_test.sh infra/coturn/start.sh
      - name: Installer tests (stubbed Docker, DNS, firewall and cron)
        run: bash infra/test/install_test.sh
      - name: Sounds are reproducible; the logo and icons generate
        run: |
          pip install --quiet pillow
          python3 tools/sounds/generate.py /tmp/sounds
          # Writes into the repository; PNG bytes can differ between
          # Pillow versions, so this only checks that it runs.
          python3 tools/icons/generate.py
          for f in ringtone ringback knock answered; do cmp /tmp/sounds/$f.wav app/assets/sounds/$f.wav; done
          echo "sounds match"

  app:
    name: App (analyze, test, web + end-to-end call)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Crypto test vectors are reproducible
        working-directory: tools/crypto-vectors
        run: |
          npm ci
          node gen.js > /tmp/vectors.json
          python3 - <<'PY'
          import json
          v = json.load(open('/tmp/vectors.json'))
          src = open('../../app/lib/crypto/test_vectors.dart').read()
          # The reference envelope is random on every run; everything else is deterministic.
          missing = [k for k, value in v.items() if k != 'sealedAtoB' and value not in src]
          assert not missing, f'test_vectors.dart is out of date: {missing}'
          print('vectors match')
          PY
      - name: Analyze and test
        working-directory: app
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test
      - name: Build web (pointed at the local relay)
        working-directory: app
        run: flutter build web --no-web-resources-cdn --dart-define=SOTTO_RELAY_URL=ws://localhost:8080/relay
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start TURN, relay and web server
        run: |
          sudo apt-get update && sudo apt-get install -y coturn
          # The package starts its own coturn service on port 3478 (no
          # authentication): stop it, so the test's TURN server below gets
          # the port and the tests talk to it.
          sudo systemctl stop coturn || true
          # Test-only TURN server on loopback (production config: infra/coturn/start.sh).
          turnserver -n --listening-ip=127.0.0.1 --listening-port=3478 \
            --use-auth-secret --static-auth-secret=e2e-secret --realm=sotto.test \
            --allow-loopback-peers --no-cli --no-tls --no-dtls --fingerprint --no-tcp-relay \
            --min-port=50000 --max-port=50200 --userdb=/tmp/turndb --pidfile=/tmp/turn.pid \
            --log-file=/tmp/turn.log &
          (cd server && npm ci && npm run build)
          HOST=127.0.0.1 PORT=8080 \
            SOTTO_STUN_URLS='stun:127.0.0.1:3478' \
            SOTTO_TURN_URLS='turn:127.0.0.1:3478?transport=udp' \
            SOTTO_TURN_SECRET=e2e-secret \
            node server/dist/index.js &
          python3 -m http.server 8099 --bind 127.0.0.1 --directory app/build/web &
          sleep 2
          # The TURN server must still be running (it exits if the port is taken).
          kill -0 "$(cat /tmp/turn.pid)" || { cat /tmp/turn.log; exit 1; }
      - name: End-to-end call test
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
          npm test

  linux:
    name: Linux build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libpulse-dev libsecret-1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libayatana-appindicator3-dev libnotify-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - working-directory: app
        run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: sotto-linux
          path: app/build/linux/x64/release/bundle

  android:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - working-directory: app
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: sotto-android-debug
          path: app/build/app/outputs/flutter-apk/app-debug.apk

  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - working-directory: app
        run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: sotto-windows
          path: app/build/windows/x64/runner/Release

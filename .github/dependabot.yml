# Weekly pull requests for dependency updates (security fixes arrive as
# soon as they are published). CI checks each one.
version: 2
updates:
  - package-ecosystem: npm
    directory: /server
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /e2e
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
  - package-ecosystem: pub
    directory: /app
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      # 0.6+ is built on nativeapi (dart:ffi), which does not compile for
      # the web app; moving to it needs the tray code kept out of web builds.
      - dependency-name: tray_manager
        versions: ['>=0.6.0']
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /server
    schedule: { interval: weekly }
